project:
  type: book
  output-dir: _book

book:
  title: "Inseguridad dentro de las cárceles del Ecuador"
  subtitle: "Un modelo de gobernanza criminal con datos del Censo Penitenciario 2022. Avance de investigación"
  author: "Zury Jiménez, Judith Luna"
  date: "2026-11-04"
  chapters:
    - index.qmd
    - 01_introduccion.qmd
    - 02_marco_teorico.qmd
    - 03_metodologia.qmd
    - references.qmd

# APA 7.ª edición
bibliography: references.bib
csl: apa.csl
lang: es
number-sections: false

# Los capítulos muestran resultados, no código
execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
