project:
  type: book
  output-dir: _book
  execute-dir: project

book:
  title: "Inseguridad dentro de las cárceles del Ecuador"
  subtitle: "Un modelo de gobernanza criminal con datos del Censo Penitenciario 2022. Avance de investigación"
  author: "Zury Jiménez, Judith Luna"
  date: "2026-11-04"
  chapters:
    - index.qmd                    # Resumen
    - 01_introduccion.qmd          # Introducción
    - 02_marco_teorico.qmd    # Revisión literaria
    - 03_metodologia.qmd     # Datos y metodología
    - references.qmd               # Referencias

# APA 7.ª edición
bibliography: references.bib
csl: apa.csl
lang: es
number-sections: false

# Los capítulos muestran resultados, no código
execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    fig-dpi: 200
    fig-align: center
